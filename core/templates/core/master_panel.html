{% extends "base.html" %}

{% block title %}Master – Configurações{% endblock %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-header bg-white">
    <strong>Recursos globais</strong>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        {% for feature in features %}
        <div class="col-md-6">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="feature_{{ feature.key }}" name="feature_{{ feature.key }}"
                   {% if feature.is_enabled %}checked{% endif %}>
            <label class="form-check-label" for="feature_{{ feature.key }}">
              {{ feature.label }}
            </label>
          </div>
        </div>
        {% endfor %}
      </div>
      <div class="mt-4 d-flex justify-content-end">
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
